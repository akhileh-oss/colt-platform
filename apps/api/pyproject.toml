[project]
name = "colt-api"
version = "0.1.0"
description = "Colt FastAPI application — the HTTP API boundary and composition root."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colt-domain",
    "colt-application",
    "colt-db",
    "colt-policy",
    "colt-observability",
    "colt-ai",
    "colt-agents",
    "colt-integrations",
    "colt-workflows",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colt_api"]
