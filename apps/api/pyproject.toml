[project]
name = "colt-api"
version = "0.1.0"
description = "Colt FastAPI application — the HTTP API boundary and composition root."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121",
    "uvicorn[standard]>=0.38",
    "pyjwt[crypto]>=2.13",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "temporalio>=1.9",
    "colt-config",
    "colt-domain",
    "colt-application",
    "colt-db",
    "colt-policy",
    "colt-observability",
    "colt-ai",
    "colt-agents",
    "colt-integrations",
    "colt-workflows",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colt_api"]
