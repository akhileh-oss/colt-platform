[project]
name = "colt-agents"
version = "0.1.0"
description = "Agent definitions, prompts and agent-runtime integration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colt-domain",
    "colt-application",
    "colt-integrations",
    "colt-ai",
    "colt-observability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colt_agents"]
