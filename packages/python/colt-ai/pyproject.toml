[project]
name = "colt-ai"
version = "0.1.0"
description = "Colt AI gateway: model routing, usage and cost accounting."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colt-config",
    "colt-observability",
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colt_ai"]
