[project]
name = "colt-application"
version = "0.1.0"
description = "Use cases and application services coordinating domain objects and ports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colt-domain",
    "colt-policy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colt_application"]
