[project]
name = "colt-db"
version = "0.1.0"
description = "SQLAlchemy models, repositories and Alembic migrations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colt-domain",
    "colt-config",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31",
    "alembic>=1.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colt_db"]
