[project]
name = "colt-domain"
version = "0.1.0"
description = "Entities, value objects, enumerations, invariants and deterministic business rules."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "email-validator>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colt_domain"]
