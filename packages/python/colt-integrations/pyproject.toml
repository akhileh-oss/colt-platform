[project]
name = "colt-integrations"
version = "0.1.0"
description = "Provider adapters implementing the domain-facing ports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colt-domain",
    "colt-config",
    "colt-observability",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colt_integrations"]
