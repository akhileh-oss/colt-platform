[project]
name = "colt-observability"
version = "0.1.0"
description = "Structured logging, tracing and metrics helpers built on OpenTelemetry."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colt-config",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "sentry-sdk>=2.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colt_observability"]
