[project]
name = "colt-policy"
version = "0.1.0"
description = "Authorization and business-safety policy engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colt-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colt_policy"]
