[project]
name = "colt-workflows"
version = "0.1.0"
description = "Temporal workflows and activities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colt-domain",
    "colt-application",
    "colt-integrations",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colt_workflows"]
